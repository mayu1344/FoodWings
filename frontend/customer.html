<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foodu · Order food</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/foodu.css">
<link rel="stylesheet" href="css/customer.css">
</head>
<body>
<header class="topbar">
  <div class="wrap row between wrapf" style="gap:14px">
    <a class="brand" href="#/home"><span class="logo" id="logo"></span>Foodu</a>
    <label class="addr" title="Deliver to">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <select id="addrSel" aria-label="Delivery address"></select>
    </label>
    <div class="hsearch grow" id="hsearch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D6560" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="inp" placeholder="Search restaurants or cuisines" aria-label="Search">
    </div>
    <nav class="row" style="gap:10px">
      <a class="lnk" href="#/orders">My orders</a>
      <a class="btn btn-dark sm" id="cartBtn" href="#/checkout">Cart <b id="cartCount" class="cnt">0</b></a>
      <button class="avatar" id="me" type="button" title="Sign out" style="border:0"></button>
    </nav>
  </div>
</header>
<main class="wrap" id="view" style="padding-top:24px;padding-bottom:60px"></main>
<script src="js/foodu.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
