<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rider: go to the restaurant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Outfit',sans-serif;color:#111311}
a{color:#0E7A3C}a:hover{color:#095A2C}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(17,19,17,.45)}100%{box-shadow:0 0 0 18px rgba(17,19,17,0)}}
@keyframes dash{to{background-position:0 40px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.map{position:relative;background-color:#E9EFEB;background-image:linear-gradient(#DCE4DF 3px,transparent 3px),linear-gradient(90deg,#DCE4DF 3px,transparent 3px),linear-gradient(#E2E9E4 1px,transparent 1px),linear-gradient(90deg,#E2E9E4 1px,transparent 1px);background-size:120px 120px,120px 120px,30px 30px,30px 30px}
.pin{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);overflow:hidden}
.pin img{width:100%;height:100%;object-fit:cover}
.rider{animation:pulse 1.6s infinite;transition:top .2s linear;z-index:2;background:#111311}
.leg{position:absolute;width:8px;margin-left:-4px;border-radius:4px;background:#111311}
.leg i{position:absolute;inset:1px;border-radius:3px;background:#FFD60A}
.next i{background:repeating-linear-gradient(180deg,#9AA39E 0 10px,transparent 10px 18px);animation:dash 1s linear infinite}
.next{background:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:999px;border:0;font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;text-decoration:none}
.slide{position:relative;height:60px;border-radius:999px;background:#0E8A42;overflow:hidden;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.slide.wait{background:#C9D1CC;color:#4A524D}
.slide .glow{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);background-size:200% 100%;animation:shimmer 2.2s linear infinite}
.slide input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab}
.knob{position:absolute;top:6px;width:48px;height:48px;border-radius:50%;background:#fff;color:#0E8A42;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2);pointer-events:none;transition:left .08s}
.sheet{animation:up .45s both}
.thumb{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F4F7F5">
  <header style="background: #13A04F; color: #fff; padding: 18px; display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; flex-direction: column"><span style="font-size: 12px; letter-spacing: .12em; color: #DFF7E8">STEP 1 OF 2</span><b style="font-size: 20px">Go to the restaurant</b></span>
    <span style="font-weight: 800; font-size: 18px; background: #111311; padding: 8px 12px; border-radius: 12px">{{eta}}</span>
  </header>
  <section class="map" aria-label="Route from you to the restaurant" style="flex: 1">
    <div class="leg" style="left: 30%; top: 26%; height: 30%"><i></i></div>
    <div class="leg next" style="left: 30%; top: 26%; width: 40%; height: 8px; margin: -4px 0 0 0"><i style="background: repeating-linear-gradient(90deg,#9AA39E 0 10px,transparent 10px 18px)"></i></div>
    <div class="pin" style="left: 30%; top: 26%; background: #D62839"><img src="{{img.biryani}}" alt="Restaurant"></div>
    <div class="pin" style="left: 70%; top: 26%; background: #0E8A42">H</div>
    <div class="pin rider" style="left: 30%; top: {{ry}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17l4-7h5l3 7"></path></svg></div>
    <div style="position: absolute; left: 14px; top: 14px; background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.12)">{{distText}}</div>
  </section>
  <section class="sheet" style="background: #fff; border-radius: 28px 28px 0 0; margin-top: -24px; position: relative; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 24px rgba(0,0,0,.08)">
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 18px">Spice Route Biryani House</b><span style="font-size: 14px; color: #5D6560">12, 11th Main, Jayanagar 4th Block</span></span>
      <a class="btn" href="https://www.google.com/maps" style="min-height: 44px; padding: 0 16px; background: #111311; color: #fff; font-size: 15px">Navigate</a>
    </div>
    <div style="background: #F4F7F5; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px">
      <span style="display: flex; justify-content: space-between; align-items: center"><b>Order #9005</b><span style="font-size: 12px; font-weight: 800; color: {{badgeFg}}; background: {{badgeBg}}; padding: 4px 10px; border-radius: 8px">{{badge}}</span></span>
      <span style="display: flex; gap: 10px; align-items: center"><span class="thumb"><img src="{{img.biryani}}" alt=""></span>1 × Chicken Dum Biryani + Extra Raita</span>
      <span style="display: flex; gap: 10px; align-items: center"><span class="thumb"><img src="{{img.desserts}}" alt=""></span>1 × Gulab Jamun (2 pcs)</span>
      <span style="font-size: 13px; color: #5D6560">Paid online · nothing to collect</span>
    </div>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
      <label class="{{slideCls}}"><sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><span class="glow"></span></sc-if>
        <span class="knob" style="left: calc(6px + {{knob}})"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
        <span style="position: relative; pointer-events: none">{{slideText}}</span>
        <input type="range" min="0" max="100" value="{{slide}}" aria-label="Slide to confirm pickup" disabled="{{notReady}}" onInput="{{onSlide}}" onChange="{{onRelease}}">
      </label>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <a class="btn" href="RiderDrop.dc.html" style="background: #111311; color: #fff; animation: up .35s both">Picked up ✓ · Start delivery</a>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const IMG = { biryani: '/_blob/2b93675217b8cf367d18aed2a6f9a309', desserts: '/_blob/100d63858d67bb12acb52423c7f1c7aa' };
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { p: 0, slide: 0, done: false }; }
  componentDidMount() { this.t = setInterval(() => { if (this.state.p < 1) this.setState({ p: Math.min(1, this.state.p + 0.01) }); }, 120); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state, ready = s.p >= 1;
    const m = Math.ceil((1 - s.p) * 3);
    return {
      img: IMG, ry: (56 - s.p * 30) + '%',
      eta: ready ? 'Arrived' : `${m} min`, distText: ready ? 'You are at the restaurant' : `${(0.6 * (1 - s.p)).toFixed(1)} km to pickup`,
      badge: ready ? 'FOOD READY' : 'PREPARING', badgeBg: ready ? '#E7F6EC' : '#FFF4D6', badgeFg: ready ? '#0E7A3C' : '#7A4B00',
      ready, notReady: !ready, notDone: !s.done, done: s.done,
      slide: s.slide, knob: `${s.slide * 0.82}%`, slideCls: ready ? 'slide' : 'slide wait',
      slideText: ready ? 'Slide to confirm pickup' : 'Wait until you reach the restaurant',
      onSlide: (e) => { const v = +e.target.value; if (v >= 96) this.setState({ slide: 100, done: true }); else this.setState({ slide: v }); },
      onRelease: () => { if (!this.state.done) this.setState({ slide: 0 }); }
    };
  }
}
</script>
</body>
</html>
