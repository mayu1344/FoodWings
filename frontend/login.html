<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Foodu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/foodu.css">
<style>
body{background:radial-gradient(120% 80% at 0% 0%,#E7F6EC 0%,#F4F7F5 60%)}
.shell{max-width:1120px;margin:0 auto;padding:22px 20px 40px}
.split{display:flex;flex-wrap:wrap;overflow:hidden;margin-top:18px;min-height:620px}
.pic{flex:1 1 380px;position:relative;overflow:hidden;min-height:260px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:34px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 14s ease-in-out infinite alternate}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(10,40,22,.85))}
.pic>*:not(img){position:relative;z-index:1}
.pic h2{font-size:34px;font-weight:800;line-height:1.1}
.form{flex:1 1 420px;padding:34px;display:flex;flex-direction:column;gap:16px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.apps button{min-height:64px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s}
.apps button small{font-weight:500;color:var(--muted);font-size:12px}
.apps button.on{border-color:var(--green);background:var(--green-tint);color:var(--green-text);box-shadow:0 0 0 3px rgba(19,160,79,.15)}
.mode{display:inline-flex;background:#EEF1EF;border-radius:999px;padding:4px;align-self:flex-start}
.mode button{border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 18px;font-weight:700;font-size:14px;color:var(--muted)}
.mode button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:380px}
.otp span{height:58px;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:#fff;transition:border .2s}
.otp span.cur{border-color:var(--green);box-shadow:0 0 0 4px rgba(19,160,79,.15)}
.otp span.cur:empty::after{content:"";width:2px;height:26px;background:var(--ink);animation:blink 1s step-end infinite}
.otp input{position:absolute;inset:0;opacity:0;font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.apps{grid-template-columns:repeat(2,minmax(0,1fr))}.form{padding:22px}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--green-tint);display:flex;align-items:center;justify-content:center;animation:pop .45s both}
.tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .2s forwards}
.fade{animation:fadeUp .35s both}
</style>
</head>
<body>
<div class="shell">
  <a class="brand" href="index.html" style="color:var(--ink)"><span class="logo" style="background:var(--green)" id="logo"></span>Foodu</a>
  <div class="card split">
    <div class="pic" id="pic"></div>
    <div class="form" id="form"></div>
  </div>
</div>
<script src="js/foodu.js"></script>
<script src="js/login.js"></script>
</body>
</html>
