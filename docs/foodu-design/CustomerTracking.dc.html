<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live order tracking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Outfit',sans-serif;color:#111311;background:#F4F7F5}
a{color:#0E7A3C}a:hover{color:#095A2C}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(17,19,17,.45)}100%{box-shadow:0 0 0 22px rgba(17,19,17,0)}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dash{to{background-position:40px 0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;border:0;text-decoration:none;box-sizing:border-box;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:#111311;color:#fff}.btn-dark:hover{color:#fff}
.btn-ghost{background:#fff;color:#111311;border:1.5px solid #D6DCD8}
.card{background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(17,19,17,.06),0 10px 28px rgba(17,19,17,.06)}
.map{position:relative;border-radius:24px;overflow:hidden;background-color:#E9EFEB;background-image:linear-gradient(#DCE4DF 3px,transparent 3px),linear-gradient(90deg,#DCE4DF 3px,transparent 3px),linear-gradient(#E2E9E4 1px,transparent 1px),linear-gradient(90deg,#E2E9E4 1px,transparent 1px);background-size:160px 160px,160px 160px,40px 40px,40px 40px}
.park{position:absolute;border-radius:24px;background:#CFE8D7}
.water{position:absolute;border-radius:40px;background:#CFE3EE}
.pin{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);overflow:hidden}
.pin img{width:100%;height:100%;object-fit:cover}
.rider{animation:pulse 1.6s infinite;transition:left .1s linear,top .1s linear;z-index:3}
.ping{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#13A04F;animation:ping 1.8s infinite}
.tag{position:absolute;background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.seg{position:absolute;background:#111311;border-radius:4px}
.seg i{position:absolute;inset:1px;border-radius:3px;background:#FFD60A}
.gone{opacity:.2;transition:opacity .6s}
.todo i{background:repeating-linear-gradient(90deg,#FFD60A 0 12px,transparent 12px 20px);animation:dash 1s linear infinite}
.st{display:flex;gap:14px;align-items:flex-start;transition:opacity .3s}
.st .d{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transition:background .3s,transform .3s}
.done .d{background:#13A04F;color:#fff}.now .d{background:#111311;color:#fff;transform:scale(1.15);box-shadow:0 0 0 6px rgba(17,19,17,.1)}.next .d{background:#E4E8E5;color:#7B847F}
.next{opacity:.55}
.now b{animation:fadeUp .4s both}
.bar{height:8px;border-radius:999px;background:#E4E8E5;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#13A04F,#2FD07A);border-radius:999px;transition:width .2s linear}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 940px">
  <header style="background: #13A04F; padding: 14px 24px">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between">
      <a href="CustomerHome.dc.html" style="display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg><span style="font-weight: 800; font-size: 26px">Foodu</span></a>
      <span style="color: #fff; font-weight: 700; font-size: 18px">Order #9005</span>
    </div>
  </header>
  <main style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
    <section class="map" aria-label="Live map: rider, restaurant and your home" style="flex: 999 1 560px; min-width: 0; min-height: 640px">
      <div class="park" style="left: 40%; top: 12%; width: 18%; height: 16%"></div>
      <div class="park" style="left: 6%; top: 72%; width: 12%; height: 18%"></div>
      <div class="water" style="left: 76%; top: 8%; width: 18%; height: 24%"></div>
      <div class="seg {{seg1Cls}}" style="left: calc(22% - 4px); top: 8%; width: 8px; height: 22%"><i></i></div>
      <div class="seg {{seg2Cls}}" style="left: calc(22% - 4px); top: 30%; width: 8px; height: 33%"><i></i></div>
      <div class="seg {{seg2Cls}}" style="left: 22%; top: calc(63% - 4px); width: 48%; height: 8px"><i></i></div>
      <div class="ping" style="left: 70%; top: 63%"></div>
      <div class="pin" style="left: 22%; top: 30%; background: #D62839"><img src="{{img.biryani}}" alt="Restaurant"></div>
      <div class="tag" style="left: calc(22% + 32px); top: calc(30% - 14px)">Spice Route Biryani House</div>
      <div class="pin" style="left: 70%; top: 63%; background: #0E8A42">H</div>
      <div class="tag" style="left: calc(70% - 20px); top: calc(63% + 32px)">Home</div>
      <div class="pin rider" style="left: {{rx}}; top: {{ry}}; background: #111311">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17l4-7h5l3 7"></path><path d="M10 10l-1-3H6"></path></svg>
      </div>
      <div class="card" style="position: absolute; left: 20px; bottom: 20px; right: 20px; max-width: 420px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px)">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 800; font-size: 26px">{{eta}}</span><span style="font-size: 14px; color: #5D6560">{{riderNote}}</span></div>
        <div class="bar"><i style="width: {{pct}}"></i></div>
      </div>
    </section>

    <aside style="flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column; gap: 20px">
      <div class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h1 style="margin: 0; font-weight: 800; font-size: 26px">{{headline}}</h1>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
            <li class="{{s.cls}}"><span class="d">{{s.mark}}</span><span style="display: flex; flex-direction: column"><b>{{s.label}}</b><span style="font-size: 13px; color: #5D6560">{{s.sub}}</span></span></li>
          </sc-for>
        </ol>
        <button type="button" class="btn btn-ghost" onClick="{{replay}}">Replay the journey</button>
      </div>
      <div class="card" style="padding: 20px 24px; display: flex; align-items: center; gap: 14px">
        <span style="width: 52px; height: 52px; border-radius: 50%; background: #FFD7A8; color: #6B3A00; font-weight: 800; display: flex; align-items: center; justify-content: center">SB</span>
        <span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 17px">Suresh B · ★ 4.7</b><span style="font-size: 14px; color: #5D6560">Bike · KA05AB1234</span></span>
        <a class="btn btn-dark" href="tel:+919845033331" aria-label="Call rider">Call</a>
      </div>
      <div class="card" style="padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
        <b style="font-size: 17px">Spice Route Biryani House</b>
        <span>1 × Chicken Dum Biryani + Extra Raita</span>
        <span>1 × Gulab Jamun (2 pcs)</span>
        <span style="font-weight: 800; font-size: 17px; margin-top: 4px">Paid ₹422</span>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":940}}'>
const IMG = { biryani: '/_blob/2b93675217b8cf367d18aed2a6f9a309' };
const STEPS = [['Order placed & paid', '7:58 PM · VISA •••• 1111'], ['Restaurant accepted', '7:59 PM'], ['Preparing your food', 'About 20 min'], ['Ready for pickup', 'Rider is at the counter'], ['Picked up', 'On the way to you'], ['Delivered', 'Enjoy your meal!']];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { p: 0.05 }; }
  componentDidMount() { this.t = setInterval(() => { if (this.state.p < 1) this.setState({ p: Math.min(1, this.state.p + 0.0035) }); }, 100); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const p = this.state.p;
    // route: S(22%,8%) -> K(22%,30%) [0..0.35], wait at K [0.35..0.5], K -> corner(22%,63%) [0.5..0.7], corner -> H(70%,63%) [0.7..1]
    let x = 22, y = 8;
    if (p < 0.35) { y = 8 + (p / 0.35) * 22; }
    else if (p < 0.5) { y = 30; }
    else if (p < 0.7) { y = 30 + ((p - 0.5) / 0.2) * 33; }
    else { y = 63; x = 22 + ((p - 0.7) / 0.3) * 48; }
    const step = p >= 1 ? 5 : p >= 0.5 ? 4 : p >= 0.35 ? 3 : p >= 0.12 ? 2 : 1;
    const mins = Math.max(0, Math.round((1 - p) * 24));
    return {
      img: IMG, rx: x + '%', ry: y + '%', pct: Math.round(p * 100) + '%',
      seg1Cls: p < 0.35 ? '' : 'gone', seg2Cls: p < 0.5 ? 'todo' : '',
      eta: p >= 1 ? 'Delivered' : `Arriving in ${mins} min`,
      riderNote: p < 0.35 ? 'Suresh is heading to the restaurant' : p < 0.5 ? 'Suresh is picking up your food' : p < 1 ? 'Suresh is on the way' : 'Handed over at 8:22 PM',
      headline: ['', 'Restaurant accepted', 'Your food is being prepared', 'Your food is ready', 'Your order is on the way', 'Delivered. Enjoy!'][step],
      steps: STEPS.map(([label, sub], i) => ({ label, sub: i <= step ? sub : '', cls: i < step || (step === 5 && i === 5) ? 'st done' : i === step ? 'st now' : 'st next', mark: i < step || (step === 5) ? '✓' : String(i + 1) })),
      replay: () => this.setState({ p: 0.02 })
    };
  }
}
</script>
</body>
</html>
