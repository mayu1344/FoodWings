<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodu · Rider HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/foodu.css">
<style>
body{background:#DDE5E0}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--page);position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.12)}
.rtop{background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.rtop b{font-size:18px}
.scr{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:96px}
.toasts{bottom:92px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--divider);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 14px;text-decoration:none;color:var(--muted);font-weight:700;font-size:13px}
.bnav a.on{color:var(--green-text)}
.bnav a span{font-size:20px}
.rmap{height:300px;border-radius:24px;transition:filter .5s}
.rmap.off{filter:grayscale(1) opacity(.6)}
.radar{position:absolute;left:50%;top:50%;width:260px;height:260px;border-radius:50%;border:2px solid var(--green);animation:radar 2.4s linear infinite;pointer-events:none}
.radar.b{animation-delay:.8s}.radar.c{animation-delay:1.6s}
.me{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--green);border:4px solid #fff;box-shadow:0 0 0 6px rgba(19,160,79,.25);z-index:2}
.sheet{padding:18px;animation:sheet .4s cubic-bezier(.2,.8,.2,1) both;border:2px solid var(--green)}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.slide{position:relative;height:62px;border-radius:999px;background:var(--ink);overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.slide.dis{background:#9AA39E}
.slide .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 100%);background-size:200% 100%;animation:shimmer 2.5s linear infinite}
.slide input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab}
.slide .knob{position:absolute;left:5px;top:5px;width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:none;transition:left .25s}
.trow{display:flex;gap:12px;align-items:flex-start}
.trow .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.done{position:fixed;inset:0;background:var(--green);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;animation:fade .3s both}
.done .amt{font-size:64px;font-weight:800;animation:pop .5s .2s both}
.ebar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#EEF1EF;margin-top:8px}
.ebar i{display:block;height:100%;animation:grow .8s both}
@keyframes grow{from{width:0}}
</style>
</head>
<body>
<div class="phone">
  <header class="rtop"><span class="logo" style="width:38px;height:38px;background:var(--green)" id="logo"></span><div class="grow col" style="gap:0"><b>Rider HUD</b><span class="small" style="color:var(--green-soft)" id="sub"></span></div><button class="sw" id="online" type="button" aria-label="Online" title="Go online / offline"></button></header>
  <section class="scr" id="view"></section>
  <nav class="bnav" id="bnav"><a href="#/home" data-n="home"><span>🛵</span>Trips</a><a href="#/earnings" data-n="earnings"><span>₹</span>Earnings</a><a href="#/profile" data-n="profile"><span>☺</span>Profile</a></nav>
</div>
<script src="js/foodu.js"></script>
<script src="js/rider.js"></script>
</body>
</html>
