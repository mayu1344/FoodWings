<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rider: online and new offer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Outfit',sans-serif;color:#111311}
a{color:#0E7A3C}a:hover{color:#095A2C}
@keyframes radar{0%{transform:translate(-50%,-50%) scale(.2);opacity:.7}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes up{from{transform:translateY(110%)}to{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(17,19,17,.45)}100%{box-shadow:0 0 0 18px rgba(17,19,17,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(17,19,17,.06),0 8px 20px rgba(17,19,17,.08)}
.map{position:relative;background-color:#E9EFEB;background-image:linear-gradient(#DCE4DF 3px,transparent 3px),linear-gradient(90deg,#DCE4DF 3px,transparent 3px),linear-gradient(#E2E9E4 1px,transparent 1px),linear-gradient(90deg,#E2E9E4 1px,transparent 1px);background-size:120px 120px,120px 120px,30px 30px,30px 30px;transition:filter .5s}
.map.off{filter:grayscale(1) brightness(.85)}
.ring{position:absolute;left:50%;top:44%;width:260px;height:260px;border-radius:50%;border:2px solid #13A04F;background:rgba(19,160,79,.08);animation:radar 2.4s infinite}
.me{position:absolute;left:50%;top:44%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#111311;border:3px solid #fff;display:flex;align-items:center;justify-content:center;animation:pulse 1.6s infinite}
.pin{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #fff;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.25);animation:fade .4s both}
.pin img{width:100%;height:100%;object-fit:cover}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;border:0;font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.sheet{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.tog{width:64px;height:38px;border-radius:999px;border:0;position:relative;background:#5D6560;transition:background .3s}
.tog span{position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:left .3s}
.tog.on{background:#2FD07A}.tog.on span{left:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F4F7F5; position: relative">
  <header style="background: #13A04F; color: #fff; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; z-index: 2">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column"><b style="font-size: 22px">Foodu</b><span style="font-size: 11px; letter-spacing: .14em; color: #DFF7E8">RIDER HUD</span></span>
      <a href="RiderEarnings.dc.html" style="color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; background: rgba(255,255,255,.18); padding: 8px 14px; border-radius: 999px">Today ₹55</a>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; background: #111311; border-radius: 999px; padding: 6px 6px 6px 18px">
      <span style="display: flex; flex-direction: column"><b style="font-size: 16px">{{statusTitle}}</b><span style="font-size: 12px; color: #9FE0B8">{{statusSub}}</span></span>
      <button type="button" class="{{togCls}}" aria-pressed="{{onlineAttr}}" aria-label="Online" onClick="{{toggle}}"><span></span></button>
    </div>
  </header>
  <section class="{{mapCls}}" aria-label="Map around you" style="flex: 1">
    <sc-if value="{{searching}}" hint-placeholder-val="{{ false }}"><div class="ring"></div><div class="ring" style="animation-delay: 1.2s"></div></sc-if>
    <div class="me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17l4-7h5l3 7"></path></svg></div>
    <sc-if value="{{hasOffer}}" hint-placeholder-val="{{ true }}"><div class="pin" style="left: 28%; top: 22%"><img src="{{img.biryani}}" alt="Restaurant"></div></sc-if>
    <div style="position: absolute; left: 16px; top: 16px; background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.12)">{{mapNote}}</div>
  </section>

  <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
    <section class="card sheet" style="margin: -90px 12px 12px; position: relative; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-radius: 24px; text-align: center">
      <b style="font-size: 20px">You are offline</b>
      <span style="font-size: 14px; color: #5D6560">Go online to start getting orders near you.</span>
      <button type="button" class="btn" style="background: #0E8A42; color: #fff" onClick="{{toggle}}">Go online</button>
    </section>
  </sc-if>

  <sc-if value="{{hasOffer}}" hint-placeholder-val="{{ true }}">
    <section class="card sheet" style="margin: -130px 12px 12px; position: relative; padding: 18px; display: flex; flex-direction: column; gap: 12px; border-radius: 24px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #0E7A3C">NEW ORDER OFFER</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: #7A4B00">
          <svg width="30" height="30" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#FFF4D6" stroke-width="4"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#E09F00" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="{{dash}}" transform="rotate(-90 18 18)"></circle></svg>{{secs}}s
        </span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <span style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex: none"><img src="{{img.biryani}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
        <div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
          <span style="display: flex; flex-direction: column"><b style="font-size: 16px">Spice Route Biryani House</b><span style="font-size: 13px; color: #5D6560">Pickup 0.6 km · drop 0.5 km further</span></span>
        </div>
        <span style="display: flex; flex-direction: column; align-items: flex-end"><b style="font-size: 26px">₹35</b><span style="font-size: 12px; color: #5D6560">est. pay</span></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" class="btn" style="background: #fff; border: 1.5px solid #D6DCD8; color: #111311" onClick="{{reject}}">Reject</button>
        <a class="btn" href="RiderPickup.dc.html" style="background: #0E8A42; color: #fff">Accept</a>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{searching}}" hint-placeholder-val="{{ false }}">
    <section class="card sheet" style="margin: -84px 12px 12px; position: relative; padding: 18px; display: flex; flex-direction: column; gap: 6px; border-radius: 24px; text-align: center">
      <b style="font-size: 18px">Looking for orders near you…</b>
      <span style="font-size: 13px; color: #5D6560">Stay in a busy area for faster offers.</span>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const IMG = { biryani: '/_blob/2b93675217b8cf367d18aed2a6f9a309' };
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { online: true, offer: true, secs: 30 }; }
  componentDidMount() {
    this.t = setInterval(() => {
      const s = this.state;
      if (!s.online) return;
      if (s.offer) { if (s.secs <= 1) this.setState({ offer: false, secs: 30, wait: 0 }); else this.setState({ secs: s.secs - 1 }); }
      else { const w = (s.wait || 0) + 1; if (w >= 5) this.setState({ offer: true, secs: 30, wait: 0 }); else this.setState({ wait: w }); }
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state;
    return {
      img: IMG, secs: s.secs, dash: (94.2 * (1 - s.secs / 30)).toFixed(1),
      onlineAttr: s.online ? 'true' : 'false', togCls: s.online ? 'tog on' : 'tog',
      statusTitle: s.online ? 'You are online' : 'You are offline', statusSub: 'Bike · KA05AB1234',
      mapCls: s.online ? 'map' : 'map off', mapNote: s.online ? 'Jayanagar · busy area' : 'Offline',
      offline: !s.online, hasOffer: s.online && s.offer, searching: s.online && !s.offer,
      toggle: () => this.setState({ online: !s.online, offer: false, secs: 30, wait: 0 }),
      reject: () => this.setState({ offer: false, secs: 30, wait: 0 })
    };
  }
}
</script>
</body>
</html>
