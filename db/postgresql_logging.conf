# ---------------------------------------------------------------
# PostgreSQL server log settings that keep card data and other
# values OUT of the log files.
#
# Put these lines in postgresql.conf (or run them as
# ALTER SYSTEM SET ... ; SELECT pg_reload_conf();)
# ---------------------------------------------------------------

log_statement = 'ddl'                    # log CREATE/ALTER/DROP only, never INSERT/UPDATE text
log_min_duration_statement = 500         # slow-query log keeps the SQL text with $1,$2 placeholders...
log_parameter_max_length = 0             # ...but NEVER the values bound to $1,$2
log_parameter_max_length_on_error = 0    # same for statements that fail
log_min_error_statement = error
log_connections = on
log_disconnections = on

# The app must use parameterised queries (cursor.execute(sql, params)).
# Then values never appear inside the SQL text, so even the slow-query
# log only ever shows "... WHERE payment_id = $1".
