<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rider: earnings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Outfit',sans-serif;color:#111311}
a{color:#0E7A3C}a:hover{color:#095A2C}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
.card{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(17,19,17,.06),0 8px 20px rgba(17,19,17,.06);animation:fadeUp .45s both}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:12px;font-weight:700;color:#5D6560;text-decoration:none}
.nav a.on{color:#0E7A3C}
.b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.trip{width:100%;border:0;background:transparent;text-align:left;padding:14px 0;border-bottom:1px solid #EEF1EF;display:flex;flex-direction:column;gap:6px;font-family:'Outfit',sans-serif;color:#111311}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#EEF1EF}
.split i{display:block;height:100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.thumb{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F4F7F5">
  <header style="background: linear-gradient(160deg, #1DB860, #0F8E45); color: #fff; padding: 18px 18px 64px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; letter-spacing: .12em; color: #DFF7E8">TODAY'S EARNINGS</span>
    <b style="font-size: 48px; letter-spacing: -0.02em">₹{{total}}</b>
    <span style="font-size: 14px">2 trips · Suresh B · ★ 4.7</span>
  </header>
  <main style="flex: 1; margin-top: -44px; padding: 0 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div class="card" style="padding: 14px"><span style="font-size: 12px; color: #5D6560; font-weight: 700">PAID</span><div style="font-weight: 800; font-size: 24px">₹{{paid}}</div></div>
      <div class="card" style="padding: 14px; animation-delay: .06s"><span style="font-size: 12px; color: #5D6560; font-weight: 700">PENDING</span><div style="font-weight: 800; font-size: 24px">₹{{pending}}</div></div>
    </section>
    <section class="card" style="padding: 4px 16px; animation-delay: .12s">
      <sc-for list="{{trips}}" as="t" hint-placeholder-count="2">
        <button type="button" class="trip" aria-expanded="{{t.openAttr}}" onClick="{{t.toggle}}">
          <span style="display: flex; gap: 10px; align-items: center; width: 100%"><span class="thumb"><img src="{{t.img}}" alt=""></span><b style="flex: 1">#{{t.id}} · Spice Route</b><b>₹{{t.total}}</b></span>
          <span style="display: flex; justify-content: space-between; font-size: 13px; color: #5D6560; width: 100%"><span>Tap for breakdown</span><span class="b" style="background: {{t.bg}}; color: {{t.fg}}">{{t.status}}</span></span>
          <sc-if value="{{t.open}}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; flex-direction: column; gap: 8px; width: 100%; animation: fadeUp .3s both">
              <span class="split"><i style="width: {{t.wBase}}; background: #13A04F"></i><i style="width: {{t.wDist}}; background: #111311"></i><i style="width: {{t.wTip}}; background: #E09F00"></i></span>
              <span style="display: flex; justify-content: space-between; font-size: 13px"><span>● Base ₹{{t.base}}</span><span>● Distance ₹{{t.dist}}</span><span>● Tip ₹{{t.tip}}</span></span>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </section>
    <section class="card" style="padding: 14px 16px; font-size: 13px; color: #5D6560; animation-delay: .18s">Each trip pays a base amount plus a distance amount. Tips from customers go fully to you.</section>
  </main>
  <nav class="nav" style="display: flex; background: #fff; border-top: 1px solid #E4E8E5; padding-bottom: 6px">
    <a href="RiderHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Home</a>
    <a class="on" href="RiderEarnings.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Earnings</a>
    <a href="RiderOnboarding.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const IMG = { biryani: '/_blob/2b93675217b8cf367d18aed2a6f9a309', desserts: '/_blob/100d63858d67bb12acb52423c7f1c7aa' };
const TRIPS = [
  { id: 9005, base: 25, dist: 10, tip: 0, paid: false, img: IMG.biryani },
  { id: 9001, base: 25, dist: 10, tip: 20, paid: true, img: IMG.desserts }
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { k: 0, open: 9001 }; }
  componentDidMount() { this.t = setInterval(() => { if (this.state.k < 1) this.setState({ k: Math.min(1, this.state.k + 0.05) }); }, 30); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state, ease = 1 - Math.pow(1 - s.k, 3);
    const sum = (f) => TRIPS.filter(f).reduce((a, t) => a + t.base + t.dist + t.tip, 0);
    return {
      total: Math.round(sum(() => true) * ease), paid: Math.round(sum((t) => t.paid) * ease), pending: Math.round(sum((t) => !t.paid) * ease),
      trips: TRIPS.map((t) => { const tot = t.base + t.dist + t.tip; return { ...t, total: tot, status: t.paid ? 'PAID' : 'PENDING', bg: t.paid ? '#E7F6EC' : '#FFF4D6', fg: t.paid ? '#0E7A3C' : '#7A4B00',
        open: s.open === t.id, openAttr: s.open === t.id ? 'true' : 'false', toggle: () => this.setState({ open: s.open === t.id ? 0 : t.id }),
        wBase: (t.base / tot * 100) + '%', wDist: (t.dist / tot * 100) + '%', wTip: (t.tip / tot * 100) + '%' }; })
    };
  }
}
</script>
</body>
</html>
