<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0a0a0c">
  <title>FoodWings — Rider Partner HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="solo" data-kind="rider">
    <div class="announce">
      <a href="index.html" style="color:var(--yellow);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:4px;">‹ All 3 Apps</a>
      <span style="color:rgba(255,255,255,0.2);">|</span>
      <nav class="solo-nav" style="display:inline-flex;gap:6px;">

  <script src="js/screens/restaurant.js"></script>
  <script src="js/screens/rider.js"></script>

    App.initPage();
    App.mountApp(document.getElementById("app"), "rider");
